<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">MAL-Updater</title>
  <desc id="d">Your anime watch history, synced to MyAnimeList, plus recommendations worth watching.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1017"/>
      <stop offset="1" stop-color="#131c28"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8cc8ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8cc8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ee2a8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#7ee2a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8f2ff"/>
      <stop offset="1" stop-color="#b9ddff"/>
    </linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#3a6ea5"/><stop offset="1" stop-color="#1b2c44"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#a25b8a"/><stop offset="1" stop-color="#2b1d33"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#3f9a77"/><stop offset="1" stop-color="#16302a"/></linearGradient>
    <linearGradient id="p4" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#c98a3e"/><stop offset="1" stop-color="#33240f"/></linearGradient>
    <linearGradient id="p5" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#6a5cc9"/><stop offset="1" stop-color="#1e1a3a"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0.45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/></filter>
    <g id="card">
      <rect width="150" height="212" rx="14"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <circle cx="180" cy="40" r="360" fill="url(#glowA)"/>
    <circle cx="1080" cy="380" r="380" fill="url(#glowB)"/>
    <circle cx="900" cy="20" r="260" fill="url(#glowA)" opacity="0.6"/>

    <!-- poster stack -->
    <g filter="url(#soft)">
      <g transform="translate(760 120) rotate(-10)">
        <rect width="150" height="212" rx="14" fill="url(#p2)"/>
        <rect width="150" height="212" rx="14" fill="url(#shade)"/>
        <rect x="14" y="176" width="96" height="8" rx="4" fill="#fff" fill-opacity="0.75"/>
        <rect x="14" y="192" width="60" height="6" rx="3" fill="#fff" fill-opacity="0.35"/>
      </g>
      <g transform="translate(1065 92) rotate(9)">
        <rect width="150" height="212" rx="14" fill="url(#p4)"/>
        <rect width="150" height="212" rx="14" fill="url(#shade)"/>
        <rect x="14" y="176" width="88" height="8" rx="4" fill="#fff" fill-opacity="0.75"/>
        <rect x="14" y="192" width="54" height="6" rx="3" fill="#fff" fill-opacity="0.35"/>
      </g>
      <g transform="translate(860 84) rotate(-3)">
        <rect width="150" height="212" rx="14" fill="url(#p1)"/>
        <rect width="150" height="212" rx="14" fill="url(#shade)"/>
        <rect x="14" y="176" width="104" height="8" rx="4" fill="#fff" fill-opacity="0.8"/>
        <rect x="14" y="192" width="64" height="6" rx="3" fill="#fff" fill-opacity="0.4"/>
      </g>
      <g transform="translate(968 108) rotate(5)">
        <rect width="150" height="212" rx="14" fill="url(#p3)"/>
        <rect width="150" height="212" rx="14" fill="url(#shade)"/>
        <rect x="14" y="176" width="92" height="8" rx="4" fill="#fff" fill-opacity="0.8"/>
        <rect x="14" y="192" width="58" height="6" rx="3" fill="#fff" fill-opacity="0.4"/>
      </g>
    </g>

    <!-- floating status chips -->
    <g font-family="Lato, Inter, Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">
      <g transform="translate(724 58)" filter="url(#soft)">
        <rect width="208" height="40" rx="20" fill="#151b23" stroke="#2a3542"/>
        <circle cx="22" cy="20" r="6" fill="#7ee2a8"/>
        <text x="38" y="25" fill="#e8edf3">Ep 7 / 12 → MAL</text>
        <text x="180" y="25" fill="#7ee2a8">✓</text>
      </g>
      <g transform="translate(1000 330)" filter="url(#soft)">
        <rect width="232" height="40" rx="20" fill="#151b23" stroke="#2a3542"/>
        <circle cx="22" cy="20" r="6" fill="#8cc8ff"/>
        <text x="38" y="25" fill="#e8edf3">Continue a franchise</text>
      </g>
      <g transform="translate(668 322)" filter="url(#soft)">
        <rect width="214" height="40" rx="20" fill="#151b23" stroke="#2a3542"/>
        <circle cx="22" cy="20" r="6" fill="#ffd37a"/>
        <text x="38" y="25" fill="#e8edf3">Watchable now · dub</text>
      </g>
    </g>

    <!-- mark -->
    <g transform="translate(72 92)">
      <rect width="96" height="96" rx="22" fill="#151b23" stroke="#2a3542" stroke-width="1.5"/>
      <path d="M20 68V28h12.5L48 49.5 63.5 28H76v40H65V45.5L48 68.5 31 45.5V68Z" fill="#8cc8ff"/>
      <rect x="16" y="76" width="64" height="6.5" rx="3.25" fill="#7ee2a8"/>
    </g>

    <g font-family="Lato, Inter, Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
      <text x="72" y="262" font-size="80" font-weight="900" letter-spacing="-1.5" fill="url(#title)">MAL-Updater</text>
      <text x="74" y="306" font-size="24" font-weight="500" fill="#9aabbd">Your anime watch history, synced to MyAnimeList —</text>
      <text x="74" y="338" font-size="24" font-weight="500" fill="#9aabbd">plus recommendations actually worth watching.</text>
    </g>
  </g>
</svg>
