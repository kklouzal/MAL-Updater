name: quality

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: python-${{ matrix.python-version }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Prepare hermetic runtime paths
        shell: bash
        run: |
          set -euo pipefail
          runtime="/tmp/mal-updater/runtime-py${{ matrix.python-version }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          settings="$runtime/config/settings.toml"
          tmpdir="/tmp/mal-updater/tmp-py${{ matrix.python-version }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$(dirname "$settings")" "$tmpdir"
          : > "$settings"
          {
            echo "MAL_UPDATER_RUNTIME_DIR=$runtime"
            echo "MAL_UPDATER_RUNTIME_ROOT=$runtime"
            echo "MAL_UPDATER_CONFIG=$settings"
            echo "MAL_UPDATER_SETTINGS_PATH=$settings"
            echo "TMPDIR=$tmpdir"
            echo "MAL_UPDATER_QUALITY_ALLOW_AMBIENT=1"
          } >> "$GITHUB_ENV"

      - name: Install package and dev quality tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -c constraints/ci.txt -e ".[dev]"

      - name: Run tests, scoped quality gates, package inspection, and wheel smoke
        shell: bash
        run: scripts/quality.sh
