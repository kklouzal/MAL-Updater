[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mal-updater"
version = "0.1.4"
description = "Conservative multi-provider anime -> MyAnimeList sync worker and recommendation engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "MAL-Updater contributors" }
]
keywords = [
  "anime",
  "crunchyroll",
  "hidive",
  "mal",
  "myanimelist",
  "openclaw",
  "recommendations",
  "sync"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet",
  "Topic :: Multimedia :: Video",
  "Topic :: Utilities"
]
dependencies = [
  "requests>=2.31.0",
  "curl_cffi>=0.14.0",
  "tomli>=2.0.1; python_version < '3.11'"
]

[project.urls]
Homepage = "https://github.com/kklouzal/MAL-Updater"
Repository = "https://github.com/kklouzal/MAL-Updater"
Issues = "https://github.com/kklouzal/MAL-Updater/issues"
Documentation = "https://github.com/kklouzal/MAL-Updater#readme"

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "coverage[toml]>=7.10,<8",
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "ruff>=0.14,<0.15"
]

[project.scripts]
mal-updater = "mal_updater.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mal_updater.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/mal_updater"]

[tool.coverage.report]
fail_under = 80
precision = 1
skip_empty = true

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
# Repo-wide default ruff currently has existing unused-import/unused-variable
# debt. Keep the blocking CI lint non-fake by checking parse/runtime-critical
# pyflakes/pycodestyle families until the broader cleanup is scheduled.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
# Keep the typed gate scoped to the explicit files list; imported legacy modules
# are checked by their own slices rather than broadening this gate implicitly.
follow_imports = "silent"
files = [
  "src/mal_updater/auth.py",
  "src/mal_updater/auth_failure_signals.py",
  "src/mal_updater/auth_remediation.py",
  "src/mal_updater/auth_utils.py",
  "src/mal_updater/cli_parser.py",
  "src/mal_updater/contracts",
  "src/mal_updater/hidive_auth.py",
  "src/mal_updater/hidive_urls.py",
  "src/mal_updater/ingestion.py",
  "src/mal_updater/maintenance_command_semantics.py",
  "src/mal_updater/mal_user_recommendations.py",
  "src/mal_updater/persistence.py",
  "src/mal_updater/provider_niceness.py",
  "src/mal_updater/provider_registry.py",
  "src/mal_updater/provider_snapshot.py",
  "src/mal_updater/provider_types.py",
  "src/mal_updater/providers/__init__.py",
  "src/mal_updater/recommendation_actionability.py",
  "src/mal_updater/request_tracking.py",
  "src/mal_updater/runtime_retention_audit.py",
  "src/mal_updater/service_auth_state.py",
  "src/mal_updater/service_systemd_status.py",
  "src/mal_updater/service_units.py"
]
